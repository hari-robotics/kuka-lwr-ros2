/lwr/controller_manager:
  ros__parameters:
    # ROS 1 updated the controllers every Gazebo step (max_step_size 0.001 s). On the real
    # robot single_lwr.launch.py overrides it with update_rate (ROS 1: 1/getSampleTime()).
    update_rate: 1000
    joint_state_controller:
      type: joint_state_broadcaster/JointStateBroadcaster
    very_basic_joint_controller:
      type: kuka_controllers/VeryBasicJointController
    basic_joint_controller:
      type: kuka_controllers/BasicJointController
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm_state_controller:
      type: arm_state_controller/ArmStateController
    gravity_compensation_controller:
      type: lwr_controllers/GravityCompensation
    joint_impedance_controller:
      type: lwr_controllers/JointImpedanceController
    inverse_dynamics_controller:
      type: lwr_controllers/InverseDynamicsController
    computed_torque_controller:
      type: lwr_controllers/ComputedTorqueController
    one_task_inverse_kinematics:
      type: lwr_controllers/OneTaskInverseKinematics
    cartesian_impedance_controller:
      type: lwr_controllers/CartesianImpedanceController
    multi_task_priority_inverse_kinematics:
      type: lwr_controllers/MultiTaskPriorityInverseKinematics
    one_task_inverse_dynamics_JL:
      type: lwr_controllers/OneTaskInverseDynamicsJL
    multi_task_priority_inverse_dynamics:
      type: lwr_controllers/MultiTaskPriorityInverseDynamics
    minimum_effort_inverse_dynamics:
      type: lwr_controllers/MinimumEffortInverseDynamics
    back_stepping_controller:
      type: lwr_controllers/BacksteppingController
    dynamics_sliding_mode_controller:
      type: lwr_controllers/DynamicSlidingModeController
    dynamics_sliding_mode_controller_task_space_controller:
      type: lwr_controllers/DynamicSlidingModeControllerTaskSpace
/lwr/joint_state_controller:
  ros__parameters:
    publish_rate: 100
    # ROS 2: joint_state_broadcaster publishes on every update and ignores publish_rate;
    # the controller update rate reproduces the ROS 1 publish_rate of 100 Hz
    update_rate: 100
    joints:
    - lwr_a1_joint
    - lwr_a2_joint
    - lwr_e1_joint
    - lwr_a3_joint
    - lwr_a4_joint
    - lwr_a5_joint
    - lwr_a6_joint
    interfaces:
    - position
    - velocity
    - effort
/lwr/very_basic_joint_controller:
  ros__parameters:
    joint: lwr_a1_joint
    gain: 30
/lwr/basic_joint_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
/lwr/joint_trajectory_controller:
  ros__parameters:
    joints:
    - lwr_a1_joint
    - lwr_a2_joint
    - lwr_e1_joint
    - lwr_a3_joint
    - lwr_a4_joint
    - lwr_a5_joint
    - lwr_a6_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
/lwr/arm_state_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
    publish_rate: 30
/lwr/gravity_compensation_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
/lwr/joint_impedance_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
    stiffness_gains: 300
    damping_gains: 0.7
/lwr/inverse_dynamics_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
/lwr/computed_torque_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
/lwr/one_task_inverse_kinematics:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
    task_space_gain: 1.0
/lwr/cartesian_impedance_controller:
  ros__parameters:
    robot_name: lwr
    root_name: lwr_base_link
    tip_name: lwr_7_link
    publish_cartesian_pose: false
/lwr/multi_task_priority_inverse_kinematics:
